<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KORE Investment - Whitelist Confirmed</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #060d17;
      overflow: hidden;
    }

    .page-image {
      display: block;
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);

      /* Portrait phones: stretch to full height, width auto (no crop) */
      height: 100vh;
      width: auto;
      max-width: 100vw;

      /* If image is narrower than screen, fill width instead */
      min-width: 100%;
      object-fit: contain;
      object-position: top center;
    }

    /* On landscape or wide screens: cover the full screen */
    @media (orientation: landscape), (min-width: 600px) {
      .page-image {
        width: 100%;
        height: 100vh;
        object-fit: cover;
        object-position: top center;
      }
    }

    .countdown-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, #FFD700, #C5A059);
      transform-origin: left center;
      animation: drain 4s linear forwards;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
      z-index: 999;
    }

    @keyframes drain {
      from { transform: scaleX(1); }
      to   { transform: scaleX(0); }
    }
  </style>
</head>
<body>

  <img src="confirmed.png" alt="KORE Whitelist Confirmed" class="page-image">
  <div class="countdown-bar"></div>

  <script>
    setTimeout(() => {
      window.location.href = 'dashboard.html';
    }, 4000);
  </script>

</body>
</html>
